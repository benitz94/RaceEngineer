name: Publish patch release

on:
  workflow_run:
    workflows: [Offline tests]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: publish-patch-release
  cancel-in-progress: false
  queue: max

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Tag next patch and publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin
          current="$(git tag --points-at "$RELEASE_SHA" --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed -n '1p' || true)"
          if [ -n "$current" ]; then
            if gh release view "$current" >/dev/null 2>&1; then
              echo "Commit already has release $current"
            else
              gh release create "$current" --verify-tag --title "RaceEngineer $current" --generate-notes
            fi
            exit 0
          fi
          latest="$(git tag -l 'v*.*.*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed -n '1p' || true)"
          if [ -z "$latest" ]; then
            next='v0.1.0'
          else
            ver="${latest#v}"
            major="${ver%%.*}"
            rest="${ver#*.}"
            minor="${rest%%.*}"
            patch="${rest#*.}"
            next="v${major}.${minor}.$((10#$patch + 1))"
          fi
          while git rev-parse -q --verify "refs/tags/$next" >/dev/null || gh release view "$next" >/dev/null 2>&1; do
            ver="${next#v}"
            major="${ver%%.*}"
            rest="${ver#*.}"
            minor="${rest%%.*}"
            patch="${rest#*.}"
            next="v${major}.${minor}.$((10#$patch + 1))"
          done
          gh release create "$next" --target "$RELEASE_SHA" --title "RaceEngineer $next" --generate-notes
